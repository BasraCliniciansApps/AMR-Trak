name: Build AMR Trak Windows installer
on:
  push:
    tags: ['desktop-v*']
    branches: ['desktop-exe']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Build installer (tag => publish to Release, otherwise artifact only)
        run: npm run ${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'dist' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: AMR-Trak-Setup
          path: desktop/dist/*.exe
