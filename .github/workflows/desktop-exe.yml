name: Build AMR Trak Windows installer
on:
  push:
    tags: ['desktop-v*']
    branches: ['desktop-exe']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Bump version (1.0.<run number>) so installed apps see it as an update
        run: npm version 1.0.${{ github.run_number }} --no-git-tag-version
      - name: Build installer and publish GitHub Release (used by auto-update)
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: AMR-Trak-Setup
          path: desktop/dist/*.exe
      - name: Publish installer to branch desktop-installer (for easy download)
        shell: bash
        run: |
          mkdir ../_out && cp dist/*.exe ../_out/
          cd ../_out
          git init -q -b desktop-installer
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add . && git commit -q -m "Installer build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" desktop-installer
