<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMR Dashboard | Read-Only</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-6">
        <header class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 text-center">
            <h1 class="text-2xl font-bold text-blue-800">Live AMR Surveillance</h1>
            <p class="text-sm text-slate-500 mt-1">Real-time Clinical Microbiology Dashboard</p>
            <div id="connection_status" class="mt-3 inline-flex items-center gap-2 text-xs font-bold text-emerald-600 bg-emerald-50 px-3 py-1 rounded-full">
                <span class="relative flex h-2 w-2"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span></span>
                Connected to Cloud
            </div>
        </header>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 text-center">
                <div class="text-xs text-slate-500 font-bold">Total Isolates</div>
                <div class="text-2xl font-black text-slate-800 mt-1" id="dash_total">-</div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 text-center col-span-2 md:col-span-1">
                <div class="text-xs text-slate-500 font-bold">Top Pathogen</div>
                <div class="text-sm font-bold text-rose-600 truncate mt-2" id="dash_bug">-</div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 text-center col-span-2 md:col-span-2">
                <div class="text-xs text-slate-500 font-bold">Top Specimen</div>
                <div class="text-sm font-bold text-teal-600 truncate mt-2" id="dash_spec">-</div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
            <h3 class="text-sm font-bold text-slate-700 mb-4 text-center">Critical Resistance Markers (% R)</h3>
            <div class="h-[300px] relative"><canvas id="dash_chart_amr"></canvas></div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                <h3 class="text-sm font-bold text-slate-700 mb-4 text-center">Top Organisms</h3>
                <div class="h-[250px] relative"><canvas id="dash_chart_pie"></canvas></div>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                <h3 class="text-sm font-bold text-slate-700 mb-4 text-center">Top Specimens</h3>
                <div class="h-[250px] relative"><canvas id="dash_chart_bar"></canvas></div>
            </div>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
