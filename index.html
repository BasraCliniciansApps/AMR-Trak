<html lang="en">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<body class="text-gray-800 font-sans antialiased">

    <nav class="bg-blue-800 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-wide">AMR Tracker</h1>
            <div class="space-x-3 flex">
                <button onclick="showExportModal()" class="bg-green-600 text-white px-4 py-2 rounded shadow-md font-bold hover:bg-green-700 transition flex items-center gap-2">
                    📥 Export to Antibiogram
                </button>
                <button onclick="openModal()" class="bg-white text-blue-800 px-4 py-2 rounded shadow-md font-bold hover:bg-gray-100 transition">
                    + New Entry
                </button>
            </div>
        </div>
    </nav>

    <main class="w-[98%] mx-auto mt-8 mb-10">
        <div class="bg-white rounded-lg shadow-md p-2 overflow-hidden">
            <table id="recordsTable" class="display nowrap w-full" style="width:100%"></table>
        </div>
    </main>

    <!-- Modal for Data Entry -->
    <div id="formModal" class="fixed inset-0 bg-gray-900 bg-opacity-60 hidden flex justify-center items-center z-50">
        <div class="bg-white rounded-xl shadow-2xl w-11/12 md:w-11/12 lg:w-4/5 max-w-6xl max-h-[95vh] overflow-y-auto relative">
            <div class="px-6 py-4 border-b flex justify-between items-center sticky top-0 bg-white z-10 shadow-sm">
                <h3 class="text-xl font-bold text-gray-800" id="modalTitle">Add New Patient Record</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-red-500 font-bold text-2xl transition">&times;</button>
            </div>
            
            <div class="p-6">
                <form id="entryForm" class="space-y-6">
                    <input type="hidden" id="editIndex" value="-1">
                    
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-5">
                        <div class="md:col-span-1">
                            <label class="block text-sm font-medium text-gray-600 mb-1">Patient Name</label>
                            <input type="text" id="p_name" required class="w-full border-gray-300 border rounded-md p-2 focus:ring-blue-500">
                        </div>
                        <div class="md:col-span-1">
                            <label class="block text-sm font-medium text-gray-600 mb-1">Age</label>
                            <input type="number" id="p_age" class="w-full border-gray-300 border rounded-md p-2 focus:ring-blue-500">
                        </div>
                        <div class="md:col-span-1">
                            <label class="block text-sm font-medium text-gray-600 mb-1">Sex</label>
                            <select id="p_sex" class="w-full border-gray-300 border rounded-md p-2 h-[42px]">
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                            </select>
                        </div>
                        <div class="md:col-span-1">
                            <label class="block text-sm font-medium text-gray-600 mb-1">Date</label>
                            <input type="date" id="p_date" required class="w-full border-gray-300 border rounded-md p-2 h-[42px]">
                        </div>

                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-gray-600 mb-1">Ward</label>
                            <select id="p_ward" class="w-full select2-enable">
                                <option value="">Select Ward (Optional)...</option>
                                <option value="Pediatrics">Pediatrics</option>
                                <option value="Resuscitation / CCU">Resuscitation / CCU</option>
                                <option value="Internal Medicine">Internal Medicine</option>
                                <option value="General Surgery">General Surgery</option>
                                <option value="Private Ward">Private Ward</option>
                                <option value="Neonatal Unit">Neonatal Unit</option>
                                <option value="NICU">NICU</option>
                                <option value="ICU">ICU</option>
                                <option value="General Obstetrics & Gynecology">General Obstetrics & Gynecology</option>
                                <option value="Private Obstetrics & Gynecology">Private Obstetrics & Gynecology</option>
                                <option value="Neurology & Neurosurgery">Neurology & Neurosurgery</option>
                                <option value="Delivery Room">Delivery Room</option>
                                <option value="Orthopedics">Orthopedics</option>
                            </select>
                        </div>
                        <div class="md:col-span-2">
                            <div class="flex justify-between items-center mb-1">
                                <label class="block text-sm font-medium text-gray-600">Sample</label>
                                <button type="button" onclick="manageSamples()" class="text-xs text-red-500 font-semibold">⚙️ Manage</button>
                            </div>
                            <select id="p_sample" class="w-full" required></select>
                        </div>
                        
                        <div class="md:col-span-4 bg-blue-50 p-4 rounded-lg border border-blue-100">
                            <label class="block text-sm font-bold text-blue-800 mb-2">Selective Organism</label>
                            <select id="p_organism" class="w-full select2-enable" required>
                                <option value="">Type name or shortcode (e.g., ECO, PAE)...</option>
                            </select>
                            <div class="mt-3 flex flex-wrap gap-2 items-center">
                                <span class="text-xs text-gray-500 font-semibold mr-2">Quick Select:</span>
                                <button type="button" onclick="quickSelectOrganism('Escherichia coli (E.coli)')" class="text-xs bg-white text-blue-700 border border-blue-200 px-3 py-1.5 rounded-full">E. coli</button>
                                <button type="button" onclick="quickSelectOrganism('Klebsiella pneumoniae')" class="text-xs bg-white text-blue-700 border border-blue-200 px-3 py-1.5 rounded-full">K. pneumoniae</button>
                                <button type="button" onclick="quickSelectOrganism('Staphylococcus aureus')" class="text-xs bg-white text-blue-700 border border-blue-200 px-3 py-1.5 rounded-full">S. aureus</button>
                                <button type="button" onclick="quickSelectOrganism('Pseudomonas aeruginosa')" class="text-xs bg-white text-blue-700 border border-blue-200 px-3 py-1.5 rounded-full">P. aeruginosa</button>
                                <button type="button" onclick="quickSelectOrganism('Acinetobacter baumannii')" class="text-xs bg-white text-blue-700 border border-blue-200 px-3 py-1.5 rounded-full">A. baumannii</button>
                            </div>
                        </div>
                    </div>

                    <!-- Antibiotics Master Panel -->
                    <div class="border border-gray-200 rounded-lg p-5 bg-gray-50 mt-6 shadow-inner">
                        <div class="flex justify-between items-center mb-4 border-b border-gray-300 pb-2">
                            <h4 class="font-bold text-gray-800 text-lg">Antibiotics Susceptibility Panel</h4>
                            <button type="button" onclick="manageAntibiotics()" class="text-xs text-red-500 font-semibold bg-red-50 px-2 py-1 rounded">⚙️ Manage Custom</button>
                        </div>
                        
                        <!-- Search Bar for Custom/New Antibiotics -->
                        <div class="flex gap-2 mb-6 bg-white p-3 rounded border">
                            <div class="flex-1">
                                <label class="block text-xs font-bold text-gray-500 mb-1">Add Custom Antibiotic (if not found below)</label>
                                <select id="abx_selector" class="w-full">
                                    <option value="">Type custom antibiotic name...</option>
                                </select>
                            </div>
                            <button type="button" onclick="addAntibiotic()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-md font-semibold mt-5 shadow">+ Add</button>
                        </div>

                        <!-- Container for Custom added antibiotics -->
                        <div id="active_abx_container" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-2 mb-6 empty:hidden"></div>
                        
                        <!-- Container for Automatically Grouped Default Antibiotics -->
                        <div id="default_abx_container" class="space-y-6">
                            <!-- Populated by JS -->
                        </div>
                    </div>

                    <div class="flex justify-end gap-3 mt-8 pt-4 border-t sticky bottom-0 bg-white py-4 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)] z-10 px-2 -mx-2">
                        <button type="button" onclick="closeModal()" class="px-6 py-2 border border-gray-300 rounded-md text-gray-600 font-bold hover:bg-gray-100">Cancel</button>
                        <button type="submit" class="px-8 py-2 bg-blue-700 text-white rounded-md font-bold text-lg shadow-lg hover:bg-blue-800">Save Record</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

            "Klebsiella oxytoca": "klebsiella pneumoniae", "Klebsiella aerogenes": "klebsiella pneumoniae", "Citrobacter freundii": "citrobacter (spp)", 
            "Enterobacter cloacae": "enterobacter (spp)", "Serratia marcescens": "serratia"
        };

        const defaultSamples = ["Blood", "Urine", "Sputum", "Wound Swab", "CSF", "Pus", "Stool", "Aspirate"];
        let dataTable;
        let selectedAbxMap = {}; // Tracks CUSTOM added antibiotics only

        $(document).ready(function() {
            loadBacteriaOptions();
            loadSampleOptions();
            loadAntibioticOptions();
            renderDefaultAntibiotics();

            $('.select2-enable').select2({ width: '100%', dropdownParent: $('#formModal') });
            
            $('#p_sample').select2({ width: '100%', dropdownParent: $('#formModal'), tags: true, placeholder: "Select or type new sample..." });
            
            // The custom antibiotic selector
            $('#abx_selector').select2({ width: '100%', dropdownParent: $('#formModal'), tags: true, placeholder: "Type custom antibiotic name..." });
            $('#p_organism').select2({ width: '100%', dropdownParent: $('#formModal') });

            $('#p_date').val(new Date().toISOString().split('T')[0]);
            initDataTable();
        });

        function renderDefaultAntibiotics() {
            let html = '';
            for (const [group, abxs] of Object.entries(abxGroups)) {
                html += `
                <div class="bg-white rounded border border-gray-200 shadow-sm overflow-hidden mb-4">
                    <h5 class="text-sm font-bold bg-blue-100 text-blue-800 px-3 py-1.5 border-b border-blue-200">${group}</h5>
                    <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-0">`;
                
                abxs.forEach(abx => {
                    const safeId = abx.replace(/[^a-zA-Z0-9]/g, '_');
                    html += `
                        <div class="flex items-center justify-between border-r border-b border-gray-100 p-2 hover:bg-gray-50 transition">
                            <span class="text-[11px] font-bold text-gray-700 truncate mr-1 w-2/3" title="${abx}">${abx}</span>
                            <select data-abx="${abx}" id="default_abx_${safeId}" class="default-abx-select compact-dropdown border border-gray-300 rounded text-xs font-bold bg-white focus:ring-blue-500 w-1/3 py-1">
                                <option value="" class="text-gray-400">-</option>
                                <option value="S" class="text-green-600 bg-green-50">S</option>
                                <option value="I" class="text-yellow-600 bg-yellow-50">I</option>
                                <option value="R" class="text-red-600 bg-red-50">R</option>
                            </select>
                        </div>
                    `;
                });
                html += `</div></div>`;
            }
            $('#default_abx_container').html(html);
            
            // Color changing logic for visual feedback
            $('.default-abx-select').change(function() {
                $(this).removeClass('bg-green-100 bg-yellow-100 bg-red-100');
                if ($(this).val() === 'S') $(this).addClass('bg-green-100');
                if ($(this).val() === 'I') $(this).addClass('bg-yellow-100');
                if ($(this).val() === 'R') $(this).addClass('bg-red-100');
            });
        }

        function loadBacteriaOptions() {
            const select = $('#p_organism');
            const groups = { "Gram-Negative": [], "Gram-Positive": [], "Others": [], "Fungi": [] };
            bacteriaLibrary.forEach(bact => { groups[bact.group].push(new Option(`${bact.name} (${bact.code})`, bact.name)); });
            for (const [groupName, options] of Object.entries(groups)) {
                if (options.length > 0) {
                    const optgroup = $(`<optgroup label="${groupName}"></optgroup>`);
                    options.forEach(opt => optgroup.append(opt));
                    select.append(optgroup);
                }
            }
        }

        function loadSampleOptions() {
            let savedSamples = JSON.parse(localStorage.getItem('amr_samples')) || defaultSamples;
            const sampleSelect = $('#p_sample');
            sampleSelect.empty(); 
            savedSamples.forEach(sample => { sampleSelect.append(new Option(sample, sample)); });
        }

        function loadAntibioticOptions() {
            let savedCustomAbx = JSON.parse(localStorage.getItem('amr_custom_abx')) || [];
            const selector = $('#abx_selector');
            selector.empty();
            selector.append(new Option("Type custom antibiotic name...", ""));
            // Only add custom ones to this list, default are already in UI
            savedCustomAbx.forEach(abx => { selector.append(new Option(abx, abx)); });
        }

        function quickSelectOrganism(organismName) { $('#p_organism').val(organismName).trigger('change'); }

        function initDataTable() {
            let records = JSON.parse(localStorage.getItem('amr_records')) || [];
            let cols = [
                { data: null, title: 'Action', orderable: false, render: function(data, type, row, meta) {
                    return `
                    <div class="flex gap-2">
                        <button onclick="editRecord(${meta.row})" class="bg-yellow-400 text-white px-3 py-1 rounded text-xs font-bold shadow-sm">Edit</button>
                        <button onclick="deleteRecord(${meta.row})" class="bg-red-500 text-white px-3 py-1 rounded text-xs font-bold shadow-sm">Delete</button>
                    </div>`;
                }},
                { data: 'Name', title: 'Name' }, { data: 'Age', title: 'Age' }, { data: 'Sex', title: 'Sex' },
                { data: 'Ward', title: 'Ward', defaultContent: '-' }, { data: 'Sample', title: 'Sample' },
                { data: 'Date', title: 'Date' }, { data: 'Selective organism', title: 'Selective organism' }
            ];

            let savedCustomAbx = JSON.parse(localStorage.getItem('amr_custom_abx')) || [];
            let allAbxColumns = [...new Set([...abxList, ...savedCustomAbx])];
            allAbxColumns.forEach(abx => { cols.push({ data: abx, title: abx, defaultContent: '-' }); });

            if ($.fn.DataTable.isDataTable('#recordsTable')) { $('#recordsTable').DataTable().destroy(); }

            dataTable = $('#recordsTable').DataTable({
                data: records, columns: cols, scrollX: true, 
                dom: '<"flex justify-between items-center mb-4"Bf>rt<"flex justify-between items-center mt-4"ip>',
                buttons: [
                    { extend: 'excelHtml5', text: 'Export to Excel', className: 'mr-2 rounded shadow' },
                    { extend: 'print', text: 'Print Records', className: 'rounded shadow' }
                ],
                pageLength: 15
            });
        }

        function openModal() {
            $('#entryForm')[0].reset(); $('#editIndex').val('-1'); $('#p_date').val(new Date().toISOString().split('T')[0]);
            $('#active_abx_container').empty(); selectedAbxMap = {};
            
            // Reset Selects
            $('#p_ward').val('').trigger('change'); $('#p_sex').val('Male').trigger('change');
            $('#p_sample').val(null).trigger('change'); $('#p_organism').val(null).trigger('change');
            $('#abx_selector').val(null).trigger('change');
            
            // Reset Default Antibiotic Grid
            $('.default-abx-select').val('').removeClass('bg-green-100 bg-yellow-100 bg-red-100');
            
            $('#modalTitle').text('Add New Patient Record'); $('#formModal').removeClass('hidden');
        }

        function closeModal() { $('#formModal').addClass('hidden'); }

        function addAntibiotic(abxName = null, result = 'S') {
            const abx = abxName || $('#abx_selector').val();
            if(!abx) return;

            // Check if user is trying to add an antibiotic that is already in the default grid
            let isDefault = false;
            $('.default-abx-select').each(function() {
                if ($(this).attr('data-abx').toLowerCase() === abx.toLowerCase()) {
                    $(this).val(result).trigger('change');
                    isDefault = true;
                }
            });

            if (isDefault) {
                $('#abx_selector').val(null).trigger('change'); // Clear input
                return; // Prevent duplicate adding
            }

            // Custom Add Logic
            if (selectedAbxMap[abx]) return; 
            selectedAbxMap[abx] = result;
            const safeId = abx.replace(/[^a-zA-Z0-9\s]/g, '_').trim();
            const html = `
                <div id="row_${safeId}" class="flex items-center justify-between bg-blue-50 border border-blue-200 rounded-md p-2 shadow-sm">
                    <span class="text-xs font-semibold text-blue-900 truncate w-3/5" title="${abx}">${abx}</span>
                    <select class="border border-blue-300 rounded-md p-1 text-xs font-bold bg-white focus:ring-blue-500 w-1/4 text-center" onchange="updateAbxResult('${abx}', this.value)">
                        <option value="S" class="text-green-600" ${result==='S'?'selected':''}>S</option>
                        <option value="I" class="text-yellow-600" ${result==='I'?'selected':''}>I</option>
                        <option value="R" class="text-red-600" ${result==='R'?'selected':''}>R</option>
                    </select>
                    <button type="button" onclick="removeAntibiotic('${abx}', '${safeId}')" class="text-red-500 font-bold px-2">&times;</button>
                </div>
            `;
            $('#active_abx_container').append(html);
            $('#abx_selector').val(null).trigger('change');
        }

        function updateAbxResult(abx, val) { selectedAbxMap[abx] = val; }
        function removeAntibiotic(abx, safeId) { delete selectedAbxMap[abx]; $(`#row_${safeId}`).remove(); }

        $('#entryForm').submit(function(e) {
            e.preventDefault();
            let currentSample = $('#p_sample').val();
            let savedSamples = JSON.parse(localStorage.getItem('amr_samples')) || defaultSamples;
            if (currentSample && !savedSamples.includes(currentSample)) {
                savedSamples.push(currentSample); localStorage.setItem('amr_samples', JSON.stringify(savedSamples));
                $('#p_sample').append(new Option(currentSample, currentSample, true, true)).trigger('change');
            }

            let savedCustomAbx = JSON.parse(localStorage.getItem('amr_custom_abx')) || [];
            let newAbxAdded = false;

            let record = {
                'Name': $('#p_name').val(), 'Age': $('#p_age').val(), 'Sex': $('#p_sex').val(),
                'Ward': $('#p_ward').val() || "-", 'Sample': currentSample, 'Date': $('#p_date').val(),
                'Selective organism': $('#p_organism').val()
            };

            if (!record['Selective organism']) { Swal.fire({ icon: 'error', title: 'Oops...', text: 'Please select an organism.' }); return; }

            // 1. Gather Custom Added Antibiotics
            Object.keys(selectedAbxMap).forEach(abx => {
                record[abx] = selectedAbxMap[abx];
                if (!abxList.includes(abx) && !savedCustomAbx.includes(abx)) { savedCustomAbx.push(abx); newAbxAdded = true; }
            });

            // 2. Gather Default Grid Antibiotics
            $('.default-abx-select').each(function() {
                const val = $(this).val();
                if (val && val !== "") {
                    record[$(this).attr('data-abx')] = val;
                }
            });

            if (newAbxAdded) { localStorage.setItem('amr_custom_abx', JSON.stringify(savedCustomAbx)); loadAntibioticOptions(); }

            let records = JSON.parse(localStorage.getItem('amr_records')) || [];
            let editIndex = $('#editIndex').val();
            if (editIndex > -1) { records[editIndex] = record; } else { records.push(record); }

            localStorage.setItem('amr_records', JSON.stringify(records));
            closeModal(); initDataTable(); 
            Swal.fire({ icon: 'success', title: 'Saved!', showConfirmButton: false, timer: 1500 });
        });

        function editRecord(index) {
            let records = JSON.parse(localStorage.getItem('amr_records')) || [];
            let record = records[index];
            openModal(); $('#modalTitle').text('Edit Patient Record'); $('#editIndex').val(index);
            
            $('#p_name').val(record['Name']); $('#p_age').val(record['Age']); $('#p_sex').val(record['Sex']).trigger('change');
            if (record['Ward'] && record['Ward'] !== "-") { $('#p_ward').val(record['Ward']).trigger('change'); } else { $('#p_ward').val('').trigger('change'); }
            
            if ($('#p_sample').find("option[value='" + record['Sample'] + "']").length) { $('#p_sample').val(record['Sample']).trigger('change'); } 
            else { $('#p_sample').append(new Option(record['Sample'], record['Sample'], true, true)).trigger('change'); }

            $('#p_date').val(record['Date']);
            
            if ($('#p_organism').find("option[value='" + record['Selective organism'] + "']").length) { $('#p_organism').val(record['Selective organism']).trigger('change'); } 
            else { $('#p_organism').append(new Option(record['Selective organism'], record['Selective organism'], true, true)).trigger('change'); }

            // Populate Default Grid
            abxList.forEach(abx => {
                if(record[abx] && record[abx] !== '-') {
                    $(`.default-abx-select[data-abx="${abx}"]`).val(record[abx]).trigger('change');
                }
            });

            // Populate Custom Added
            let savedCustomAbx = JSON.parse(localStorage.getItem('amr_custom_abx')) || [];
            savedCustomAbx.forEach(abx => {
                if(record[abx] && record[abx] !== '-') {
                    addAntibiotic(abx, record[abx]);
                }
            });
        }

        function deleteRecord(index) {
            Swal.fire({ title: 'Are you sure?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#d33', confirmButtonText: 'Yes, delete it!' })
            .then((result) => {
                if (result.isConfirmed) {
                    let records = JSON.parse(localStorage.getItem('amr_records')) || [];
                    records.splice(index, 1); localStorage.setItem('amr_records', JSON.stringify(records));
                    initDataTable(); Swal.fire('Deleted!', '', 'success');
                }
            });
        }

        function manageSamples() {
            let savedSamples = JSON.parse(localStorage.getItem('amr_samples')) || defaultSamples;
            let customSamples = savedSamples.filter(s => !defaultSamples.includes(s));
            if (customSamples.length === 0) { Swal.fire({ icon: 'info', title: 'No Custom Samples' }); return; }
            let html = '<div class="text-left space-y-2 mt-4">';
            customSamples.forEach(sample => {
                html += `<div class="flex justify-between items-center bg-gray-100 p-3 rounded border">
                    <span class="font-medium text-gray-700">${sample}</span>
                    <button type="button" onclick="deleteCustomSample('${sample.replace(/'/g, "\\'")}')" class="text-red-500 font-bold bg-white px-3 py-1 rounded border">Delete</button></div>`;
            });
            html += '</div>';
            Swal.fire({ title: 'Manage Custom Samples', html: html, confirmButtonText: 'Done' });
        }

        window.deleteCustomSample = function(sample) {
            let s = JSON.parse(localStorage.getItem('amr_samples')) || defaultSamples;
            localStorage.setItem('amr_samples', JSON.stringify(s.filter(x => x !== sample)));
            loadSampleOptions(); manageSamples();
        };

        function manageAntibiotics() {
            let savedCustomAbx = JSON.parse(localStorage.getItem('amr_custom_abx')) || [];
            if (savedCustomAbx.length === 0) { Swal.fire({ icon: 'info', title: 'No Custom Antibiotics' }); return; }
            let html = '<div class="text-left space-y-2 mt-4">';
            savedCustomAbx.forEach(abx => {
                html += `<div class="flex justify-between items-center bg-gray-100 p-3 rounded border">
                    <span class="font-medium text-gray-700 truncate w-3/4">${abx}</span>
                    <button type="button" onclick="deleteCustomAntibiotic('${abx.replace(/'/g, "\\'")}')" class="text-red-500 font-bold bg-white px-3 py-1 rounded border">Delete</button></div>`;
            });
            html += '</div>';
            Swal.fire({ title: 'Manage Custom Antibiotics', html: html, confirmButtonText: 'Done' });
        }

        window.deleteCustomAntibiotic = function(abx) {
            let s = JSON.parse(localStorage.getItem('amr_custom_abx')) || [];
            localStorage.setItem('amr_custom_abx', JSON.stringify(s.filter(a => a !== abx)));
            loadAntibioticOptions(); initDataTable(); manageAntibiotics();
        };

        // --- Export to Antibiogram Feature ---
        function showExportModal() {
            Swal.fire({
                title: 'Export to Antibiogram',
                html: `
                    <div class="text-left space-y-4">
                        <p class="text-sm text-gray-500 bg-blue-50 p-2 rounded">Offline Mode: Select the date range and choose the blank 'Antibiogram.xlsx' file from your PC.</p>
                        <div class="flex gap-4">
                            <div class="flex-1">
                                <label class="block text-sm font-medium text-gray-700 mb-1">From Date</label>
                                <input type="date" id="export_start" class="w-full border p-2 rounded focus:ring-blue-500">
                            </div>
                            <div class="flex-1">
                                <label class="block text-sm font-medium text-gray-700 mb-1">To Date</label>
                                <input type="date" id="export_end" class="w-full border p-2 rounded focus:ring-blue-500">
                            </div>
                        </div>
                        <div class="mt-3">
                            <label class="block text-sm font-bold text-gray-700 mb-1">Upload Antibiogram Template (.xlsx)</label>
                            <input type="file" id="template_file" accept=".xlsx" class="w-full border border-gray-300 p-2 rounded bg-gray-50">
                        </div>
                    </div>
                `,
                showCancelButton: true, confirmButtonText: 'Generate & Download', confirmButtonColor: '#16a34a',
                preConfirm: () => {
                    const start = document.getElementById('export_start').value;
                    const end = document.getElementById('export_end').value;
                    const fileInput = document.getElementById('template_file');
                    
                    if (!start || !end) { Swal.showValidationMessage('Please select dates'); return false; }
                    if (fileInput.files.length === 0) { Swal.showValidationMessage('Please upload the Excel template'); return false; }
                    
                    return { start, end, file: fileInput.files[0] };
                }
            }).then((result) => {
                if (result.isConfirmed) processAntibiogramExport(result.value.start, result.value.end, result.value.file);
            });
        }

        async function processAntibiogramExport(startDate, endDate, templateFile) {
            try {
                Swal.fire({ title: 'Generating File...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });

                let allRecords = JSON.parse(localStorage.getItem('amr_records')) || [];
                let records = allRecords.filter(r => r.Date >= startDate && r.Date <= endDate);

                if(records.length === 0) { Swal.fire('No Data', 'No records found in this range.', 'info'); return; }

                const arrayBuffer = await templateFile.arrayBuffer();
                const workbook = new ExcelJS.Workbook();
                await workbook.xlsx.load(arrayBuffer);
                const sheet = workbook.worksheets[0]; 

                let excelAbxColumns = {};
                sheet.getRow(5).eachCell((cell, colNum) => {
                    let val = cell.value ? cell.value.toString().trim().toLowerCase() : "";
                    if (val) excelAbxColumns[val] = { tested: colNum - 1, resistant: colNum, percent: colNum + 1 };
                });

                let excelOrgRows = {};
                for (let r = 6; r <= 50; r++) {
                    let cellVal = sheet.getCell(r, 2).value;
                    if (cellVal) excelOrgRows[cellVal.toString().trim().toLowerCase()] = r;
                }

                let stats = {};
                records.forEach(r => {
                    let orgName = r['Selective organism'];
                    let mappedOrg = orgMapExport[orgName];
                    if (!mappedOrg) return; 

                    if (!stats[mappedOrg]) stats[mappedOrg] = { total: 0, abx: {} };
                    stats[mappedOrg].total += 1;

                    Object.keys(abxMapExport).forEach(appAbx => {
                        let excelAbx = abxMapExport[appAbx].toLowerCase();
                        let result = r[appAbx];
                        
                        if (result && result !== '-' && result !== '') {
                            if (!stats[mappedOrg].abx[excelAbx]) stats[mappedOrg].abx[excelAbx] = { tested: 0, resistant: 0 };
                            stats[mappedOrg].abx[excelAbx].tested += 1; 
                            if (result === 'R') stats[mappedOrg].abx[excelAbx].resistant += 1; 
                        }
                    });
                });

                Object.keys(stats).forEach(org => {
                    let rowNum = excelOrgRows[org];
                    if (rowNum) {
                        sheet.getCell(rowNum, 3).value = stats[org].total;
                        Object.keys(stats[org].abx).forEach(abx => {
                            let cols = excelAbxColumns[abx];
                            if (cols) {
                                let s = stats[org].abx[abx];
                                sheet.getCell(rowNum, cols.tested).value = s.tested;
                                sheet.getCell(rowNum, cols.resistant).value = s.resistant;
                                sheet.getCell(rowNum, cols.percent).value = Math.round((s.resistant / s.tested) * 100) + '%';
                            }
                        });
                    }
                });

                const buffer = await workbook.xlsx.writeBuffer();
                const sDate = new Date(startDate).toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
                const eDate = new Date(endDate).toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
                saveAs(new Blob([buffer]), `Antibiogram ${sDate} to ${eDate}.xlsx`);
                Swal.fire('Success!', `File Downloaded.`, 'success');

            } catch (error) {
                console.error(error);
                Swal.fire('Error', 'Failed to process the Excel file. Make sure it is the correct template.', 'error');
            }
        }
    </script>
